# Nexa mobile CI — offline branch (no server deployment).
#
# - Frontend tests (vue-tsc + vitest) on every push/PR.
# - Android debug APK artifact on every push to this branch so a build is
#   always downloadable without any local toolchain.
# - Signed release APK flow stays a manual, key-protected step (docs/ANDROID_SIGNING.md).
#
# No secrets required.

name: CI

on:
  push:
    branches: [mobile-app]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  android:
    name: Android debug APK
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble vendored Gradle distribution
        # Runner egress refused connections to every Gradle CDN at least once,
        # so the distribution ships inside the repo in split parts and is
        # reconstituted locally; the wrapper then uses a file: URL.
        run: bash scripts/setup-gradle-dist.sh --ci

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle distribution cache
        # First run downloads the wrapper zip from the probed mirror; later
        # runs restore the extracted distribution and never touch the network.
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-8.14.3-bin
        continue-on-error: true

      - name: Gradle dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/notification
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('android/**/*.gradle') }}
          restore-keys: gradle-deps-${{ runner.os }}-

      - name: npm ci + build web assets
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nexa-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
