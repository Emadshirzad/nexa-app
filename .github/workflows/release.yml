# Nexa release APK — publish a download for users on every version tag.
#
# Trigger: push a tag like v1.0.2
#   git tag v1.0.2 && git push origin v1.0.2
#
# Builds the debug APK (debug-signed so it installs without Play Store)
# and attaches it to a GitHub Release with auto-generated notes.
#
# No secrets required (GITHUB_TOKEN is implicit).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# Release keystore is shipped via repo secrets:
#   NEXA_KEYSTORE_B64        — keystore file, base64-encoded
#   NEXA_KEYSTORE_PASSWORD   — its password (also used as key password)
# Falls back to a debug-signed APK if secrets are not configured yet.
env:
  NEXA_KEYSTORE_PATH: $GITHUB_WORKSPACE/keys/nexa-release.keystore
  NEXA_KEYSTORE_PASSWORD: ${{ secrets.NEXA_KEYSTORE_PASSWORD }}
  NEXA_KEY_ALIAS: nexa-crm-release
  NEXA_KEY_PASSWORD: ${{ secrets.NEXA_KEYSTORE_PASSWORD }}

jobs:
  build-and-release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install release keystore from secrets
        # NEXA_KEYSTORE_B64 = keystore file, base64-encoded
        if: ${{ secrets.NEXA_KEYSTORE_B64 != '' }}
        run: |
          mkdir -p keys
          echo "${{ secrets.NEXA_KEYSTORE_B64 }}" | base64 -d > keys/nexa-release.keystore
          chmod 600 keys/nexa-release.keystore

      - name: Reassemble vendored Gradle distribution
        # Same reason as CI: runner egress to Gradle CDNs is unreliable,
        # distribution ships as split parts inside the repo.
        run: bash scripts/setup-gradle-dist.sh --ci

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle distribution cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-8.14.3-bin
        continue-on-error: true

      - name: Gradle dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/notification
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('android/**/*.gradle') }}
          restore-keys: gradle-deps-${{ runner.os }}-

      - name: npm ci + build web assets
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble signed APK (release) or debug fallback
        working-directory: android
        run: |
          if [ -f ../keys/nexa-release.keystore ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk .
            mv app-release.apk signed.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk .
            mv app-debug.apk signed.apk
          fi

      - name: Rename APK + checksum
        id: apk
        run: |
          APK=android/signed.apk
          ARTIFACT_NAME="Nexa-${{ github.ref_name }}-release.apk"
          mkdir -p dist-release
          cp "$APK" "dist-release/$ARTIFACT_NAME"
          sha256sum "$APK" > "dist-release/$ARTIFACT_NAME.sha256"
          echo "file=dist-release/$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        if: ${{ secrets.NEXA_KEYSTORE_B64 != '' }}
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs android/signed.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "${{ steps.apk.outputs.file }}#Nexa CRM release APK" \
            "${{ steps.apk.outputs.file }}.sha256#SHA-256 checksum" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
