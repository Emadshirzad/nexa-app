# Nexa CRM — memory-conscious nginx main configuration.
#
# One worker is enough for a single-host deployment and keeps nginx around
# 5–10 MB RSS. Logs go to the container stdout/stderr so `docker compose
# logs` is the single source of truth.

user  nginx;
worker_processes  1;
worker_rlimit_nofile 1024;

error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  512;
    multi_accept        off;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   30;
    keepalive_requests  100;
    server_tokens       off;
    types_hash_max_size 2048;

    # Invoice/CSV uploads are small; 8 MB leaves headroom over the PHP-side
    # upload_max_filesize in backend/docker/php.ini.
    client_max_body_size      8m;
    client_body_buffer_size   16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;
    client_body_timeout       60s;
    client_header_timeout     15s;
    send_timeout              600s;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   4;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
