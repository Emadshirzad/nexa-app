# Nexa CRM — public vhost.
#
#   /            → static Vite SPA (with history-mode fallback)
#   /api/        → Laravel via php-fpm  (routes/api.php mounts /api/v1)
#   /sanctum/    → Laravel via php-fpm  (Sanctum SPA csrf-cookie route)
#   /healthz     → container health probe
#
# Uses Docker's embedded DNS resolver with a short cache so an `api` container
# that gets a new IP after a restart is picked up without reloading nginx.

server {
    listen      80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-Frame-Options          "SAMEORIGIN"                      always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve dotfiles (.htaccess, .env, editor metadata).
    location ~ (^|/)\.(?!well-known(/|$)) {
        deny all;
        access_log off;
    }

    # Laravel API. `^~` stops the static-file regex below from ever matching
    # API paths. The FastCGI parameters are listed explicitly instead of
    # including fastcgi_params: nginx's static root is the SPA, while PHP must
    # always execute backend/public/index.php.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend "api:9000";
        fastcgi_pass $api_backend;
        include fastcgi-params.conf;
    }

    # Sanctum SPA authentication issues its CSRF cookie outside /api.
    location ^~ /sanctum/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend "api:9000";
        fastcgi_pass $api_backend;
        include fastcgi-params.conf;
    }

    # Content-hashed Vite bundles can be cached forever.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location ~* \.(?:css|js|mjs|json|map|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        try_files $uri =404;
        expires 30d;
    }

    # SPA history-mode fallback; the shell itself must never be cached.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
