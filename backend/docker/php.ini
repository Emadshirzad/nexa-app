; Nexa CRM — low-memory production PHP defaults.
;
; This file is installed as /usr/local/etc/php/conf.d/zz-nexa.ini. Keep the
; per-process budget aligned with API_MEM_LIMIT in compose.yaml.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Laravel long imports and PDF/CSV generation stay inside this.
memory_limit = 128M
max_execution_time = 120
max_input_time = 60

; API accepts JSON payloads; 8 MB leaves headroom for CSV imports.
post_max_size = 8M
upload_max_filesize = 8M
max_input_vars = 2000

; Container environment variables must reach Laravel through $_ENV/$_SERVER.
variables_order = "EGPCS"

default_charset = "UTF-8"
date.timezone = UTC
cgi.fix_pathinfo = 0

; Fewer stat syscalls, less per-request heap churn.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache: cache compiled PHP in shared memory. Timestamp validation is off
; because the code is immutable inside the image; rebuild/restart to deploy.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 32
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 6000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.jit = off
opcache.jit_buffer_size = 0
