; Nexa CRM — small-footprint PHP-FPM pool overrides.
;
; This file is loaded after the image's www.conf (zz-* sorts last), so it only
; changes the pool sizing. `ondemand` reaps idle workers after 10 s, meaning
; an idle stack keeps roughly one master plus zero children in memory. Raise
; pm.max_children (and API_MEM_LIMIT in compose.yaml) only when you need more
; concurrent requests; budget ~128 MB per child.
;
; pm settings are the only sizing knobs; www.conf supplies user/group and the
; official docker.conf enables stderr logging and worker-output forwarding.

[www]
; Bind on all interfaces so the nginx container can reach php-fpm.
listen = 9000

; Container environment (APP_*, DB_*) must reach Laravel.
clear_env = no

pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Long-running imports (CSV, PDF) must not be killed mid-flight.
request_terminate_timeout = 120s
