distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# NOTE: do not commit a machine-specific file: URL here.
# scripts/setup-gradle-dist.sh (run automatically by CI) rewrites this line to
# a file: URL pointing at the vendored, sha256-verified distribution in
# android/gradle/wrapper/dist-unbundled/. We stopped relying on the CDN URL
# below because GitHub Actions runs saw TCP RSTs ("Connection refused") from
# services.gradle.org, Tencent, Huawei and Aliyun mirrors.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
networkTimeout=60000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
